# Dependabot proposes updates for SetupMan's Go libraries and the GitHub Actions it uses,
# once a month, as pull requests (nothing is merged automatically).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-libraries:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
